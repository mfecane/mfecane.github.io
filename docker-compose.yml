name: mfecane.github.io

services:
    frontend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - type: bind
              source: .
              target: /app
            - app_node_modules:/app/node_modules
        ports:
            - "127.0.0.1:3000:3000"
        command: sh -c "npm install && npm run dev"
        restart: unless-stopped

volumes:
    app_node_modules:
